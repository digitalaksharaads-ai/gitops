name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GCC
        run: sudo apt-get install -y build-essential

      - name: Build with Makefile
        run: make

      - name: Run tests
        run: make test

      - name: Upload artifact (binary)
        uses: actions/upload-artifact@v4
        with:
          name: app-exe
          path: ./app.exe
